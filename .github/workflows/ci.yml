name: ci
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-file-icons.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Published tarball and Git installs use the committed lib/; keep the
      # checked-in runtime artifacts in sync with src/ (Ubuntu only: generated
      # output can differ by platform in source-map paths).
      - if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- lib
